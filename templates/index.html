{% extends "base.html" %}
{% load socialaccount %}

{% block content %}
    <h2>Home Page</h2>
    <p>Welcome to the Django-Allauth application. Use the navigation links above to explore the site.</p>
    
    <br>
    <hr>
    
    {% if not user.is_authenticated %}
    <a href="{% url 'account_login' %}">Login</a>
    {% else %}
        <p>Welcome, {{ user.username }}!</p>
    {% endif %}

        
{% endblock %}
